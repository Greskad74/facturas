# ============================================
# CONFIGURACIÓN DE LA BASE DE DATOS H2
# ============================================

# Dónde se guardará la base de datos (en una carpeta llamada "data" del proyecto)
spring.datasource.url=jdbc:h2:file:./data/facturasdb

# Credenciales (para H2 local, usuario "sa" sin contraseña es lo estándar)
spring.datasource.username=sa
spring.datasource.password=

# Le decimos a Spring que use H2
spring.datasource.driver-class-name=org.h2.Driver

# Le decimos a JPA que cree/actualice las tablas automáticamente según nuestras entidades
spring.jpa.hibernate.ddl-auto=update

# Mostrar en la consola los comandos SQL que se ejecutan (útil para aprender)
spring.jpa.show-sql=true

# Habilitar la consola web de H2 (para ver los datos desde el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console